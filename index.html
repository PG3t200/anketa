<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анкета ИТ</title>
<style>
:root{
  --bg:#f3f6f9; --card:#ffffff; --text:#1c2733; --muted:#5f6d7a; --line:#dde4ea;
  --accent:#1f6fb2; --accent-soft:#e6f0f9; --ok:#1e8a4c; --warn:#b26a00;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171d; --card:#1a222b; --text:#e6ecf1; --muted:#97a6b3; --line:#2c3843;
    --accent:#5aa7e6; --accent-soft:#1d3346; --ok:#4cc483; --warn:#e0a24a;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 120px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:6px}
h1{font-size:23px;margin:8px 0 12px;line-height:1.25}
h2{font-size:15px;font-weight:600;color:var(--muted);margin:4px 0 14px;text-transform:uppercase;letter-spacing:.03em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.q{font-weight:600;margin-bottom:4px}
.hint{font-size:14px;color:var(--muted);margin-bottom:10px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;cursor:pointer;user-select:none}
.opt input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;min-height:46px;resize:vertical}
.big textarea{min-height:110px}
textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.nav .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
button{font:inherit;font-weight:600;border-radius:12px;padding:13px 16px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button.main{background:var(--accent);border-color:var(--accent);color:#fff;flex:1}
button:disabled{opacity:.4}
.list button{display:block;width:100%;text-align:left;margin-top:8px;font-weight:500}
.list .done{color:var(--ok)}
.small{font-size:14px;color:var(--muted)}
.actions button{display:block;width:100%;margin-top:10px}
.saved{color:var(--ok);font-size:14px;min-height:20px;margin-top:8px}
p{margin:0 0 12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="bar"><i id="bar"></i></div>
    <div class="meta"><span id="where"></span><span id="count"></span></div>
    <div class="meta"><span id="cloud"></span></div>
  </header>
  <main id="app"></main>
</div>
<div class="nav"><div class="in">
  <button id="back">Назад</button>
  <button id="next" class="main">Далее</button>
</div></div>

const N = BLOCKS.length, KEY = "anketa-it-v1";
let S = {step:0, a:{}};
try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.a) S = s; }catch(e){}
function save(){ S.t = Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} schedule(); }

// ---- Облако: Google Таблица. Работает, только если в ссылке есть ?k=код ----
const API = "https://script.google.com/macros/s/AKfycbwhmwYCIpLifIsrSu80edFRHlzL045F9EHqzKr0c2NM7zcauHumQhOJHYbfnjrpmvYO/exec"; // веб-приложение Google Apps Script
const K = new URLSearchParams(location.search).get("k") || "";
const CLOUD = !!(API && K);
let timer = null, dirty = false;
function cloud(t, warn){ const c = document.getElementById("cloud"); if(c){ c.textContent = t; c.style.color = warn ? "var(--warn)" : "var(--ok)"; } }
function payload(){ return JSON.stringify({k:K, s:S, rows:rows()}); }
function rows(){
  return BLOCKS.flatMap(([title,qs],bi)=>qs.filter(vis).map(q=>{
    const x = S.a[q[0]] || {v:[],n:""}, st = blockState(bi+1);
    return [q[0], title, q[2], x.v.join("; "), x.n.trim(), st==="sent" ? "да" : st==="changed" ? "изменён после отправки" : ""];
  }));
}
function schedule(){ if(!CLOUD) return; dirty = true; cloud("Сохраняю…"); clearTimeout(timer); timer = setTimeout(push, 1200); }
function push(){
  if(!dirty) return; dirty = false;
  fetch(API, {method:"POST", body:payload()}).then(r=>r.json())
    .then(r=>cloud(r.error ? "Не сохранилось в облаке" : "✓ Сохранено", !!r.error))
    .catch(()=>{ dirty = true; cloud("Нет связи, сохранено только на этом устройстве", true); });
}
function flush(){ if(CLOUD && dirty){ clearTimeout(timer); dirty = false; try{ navigator.sendBeacon(API, payload()); }catch(e){} } }
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "hidden") flush(); });
function loadCloud(){
  if(!CLOUD) return;
  cloud("Загружаю ответы…");
  fetch(API + "?k=" + encodeURIComponent(K)).then(r=>r.json()).then(r=>{
    if(r.error){ cloud("Неверная ссылка, ответы сохраняются только на этом устройстве", true); return; }
    if(r.s && r.s.a && (!S.t || r.s.t > S.t)){ S = r.s; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} render(); }
    else if(S.t && (!r.s || S.t > r.s.t)){ dirty = true; push(); }
    cloud("✓ Сохранено");
  }).catch(()=>cloud("Нет связи, сохранено только на этом устройстве", true));
}
function get(id){ return S.a[id] || (S.a[id] = {v:[], n:""}); }
function has(a,id,val){ return !!(a[id] && a[id].v.includes(val)); }
function vis(q){ const o=q[4]||{}; return !o.if || o.if(S.a); }
function answered(q){ const x=S.a[q[0]]; return !!x && (x.v.length>0 || x.n.trim()!==""); }
function esc(s){ return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const app = document.getElementById("app");

function render(){
  const st = S.step;
  const allQ = BLOCKS.flatMap(b=>b[1]).filter(vis);
  const done = allQ.filter(answered).length;
  document.getElementById("bar").style.width = (done/allQ.length*100)+"%";
  document.getElementById("count").textContent = "Отвечено " + done + " из " + allQ.length;
  document.getElementById("where").textContent = st===0 ? "Начало" : st>N ? "Готово" : "Блок " + st + " из " + N;
  const back = document.getElementById("back"), next = document.getElementById("next");
  back.disabled = st===0;
  next.style.display = st>N ? "none" : "";
  next.textContent = st===0 ? "Начать" : st===N ? "К отправке" : "Далее";
  if(st===0) return intro();
  if(st>N) return finish();
  const [title, qs] = BLOCKS[st-1];
  let h = "<h2>" + esc(title) + "</h2>";
  qs.forEach(q=>{
    if(!vis(q)) return;
    const [id,t,text,opts,o={}] = q, x = get(id);
    h += '<div class="card'+(t==="text"?" big":"")+'" data-id="'+id+'"><div class="q">'+id+". "+esc(text)+"</div>";
    if(o.hint || t!=="text") h += '<div class="hint">'+esc(o.hint || (t==="one" ? "Выберите один вариант" : "Можно выбрать несколько"))+"</div>";
    if(opts) opts.forEach((op,i)=>{
      const on = x.v.includes(op);
      h += '<label class="opt'+(on?" on":"")+'"><input type="'+(t==="one"?"radio":"checkbox")+'" name="q'+id+'" data-i="'+i+'"'+(on?" checked":"")+'><span>'+esc(op)+"</span></label>";
    });
    const ph = t==="text" ? (o.ph||"Ваш ответ") : (o.ph||"Пояснение, если хочется (необязательно)");
    h += '<textarea data-n="'+id+'" placeholder="'+esc(ph)+'">'+esc(x.n)+"</textarea></div>";
  });
  h += '<div class="card actions" id="sendcard"></div><div class="saved" id="saved"></div>';
  app.innerHTML = h;
  sendCard();
  window.scrollTo(0,0);
}

// Отправка одного блока. S.sent[номер блока] = текст, который был отправлен
function blockState(b){
  const t = blockText(b), was = S.sent && S.sent[b];
  return !was ? "new" : was === t ? "sent" : "changed";
}
function sendCard(){
  const el = document.getElementById("sendcard"); if(!el) return;
  const b = S.step, st = blockState(b), qs = BLOCKS[b-1][1].filter(vis), any = qs.some(answered);
  let h;
  if(st === "sent") h = '<div class="q" style="color:var(--ok)">✓ Этот блок отправлен</div>'+
    '<div class="hint">Если что-то поменяете в ответах выше, можно будет отправить исправление.</div>'+
    '<button id="unsend">Снять отметку «отправлено»</button>';
  else if(st === "changed") h = '<div class="q" style="color:var(--warn)">Ответы изменены после отправки</div>'+
    '<div class="hint">Отправьте исправленный блок, я буду смотреть последний вариант.</div>'+
    '<button class="main" id="sendblock">Отправить исправление в WhatsApp</button><button id="unsend">Снять отметку «отправлено»</button>';
  else h = '<div class="q">Отправить этот блок сейчас</div>'+
    '<div class="hint">Необязательно: можно отправить всё сразу в конце.</div>'+
    '<button class="main" id="sendblock"'+(any?"":" disabled")+'>Отправить блок в WhatsApp</button>';
  el.innerHTML = h;
  const sb = document.getElementById("sendblock"), us = document.getElementById("unsend");
  if(sb) sb.onclick = ()=>{
    const t = blockText(b), pre = st === "changed" ? "ИСПРАВЛЕНИЕ. " : "";
    S.sent = S.sent || {}; S.sent[b] = t; save(); sendCard();
    flush(); location.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(pre + t);
  };
  if(us) us.onclick = ()=>{ delete S.sent[b]; save(); sendCard(); };
}
function blockText(b){
  const [title, qs] = BLOCKS[b-1];
  let s = "Анкета, блок " + b + " из " + N + ": " + title + "\n";
  qs.filter(vis).forEach(q=>{
    const x = S.a[q[0]];
    s += "\n" + q[0] + ". " + q[2] + "\n";
    if(!answered(q)){ s += "— без ответа\n"; return; }
    if(x.v.length) s += "— " + x.v.join("; ") + "\n";
    if(x.n.trim()) s += (q[1]==="text" ? "— " : "  Пояснение: ") + x.n.trim() + "\n";
  });
  return s;
}

function intro(){
  app.innerHTML = '<h1>'+NAME+', добрый день!</h1><div class="card">'+
   "<p>Здесь все вопросы, разбитые на "+N+" коротких блоков по 3 вопроса. В большинстве достаточно нажать на подходящий вариант.</p>"+
   "<p>Если хочется что-то пояснить, под каждым вопросом есть поле для текста. Если не знаете ответа, отметьте «Не знаю», я уточню у сотрудников.</p>"+
   "<p>Ответы сохраняются сами. Можно закрыть страницу и вернуться позже по той же ссылке"+(CLOUD ? ", хоть с телефона, хоть с компьютера," : "")+" и продолжить с того же места.</p>"+
   "<p>Ответы можно отправлять мне в WhatsApp по блокам, кнопкой внизу блока, или все сразу в конце.</p></div>"+
   (Object.keys(S.a).length ? '<div class="card list"><div class="q">Перейти к блоку</div>'+
     BLOCKS.map((b,i)=>{const qs=b[1].filter(vis), ok=qs.every(answered), st=blockState(i+1);
       const tag = st==="sent" ? ' <span class="small">· отправлен</span>' : st==="changed" ? ' <span class="small" style="color:var(--warn)">· изменён, не отправлен</span>' : "";
       return '<button data-go="'+(i+1)+'"'+(ok?' class="done"':"")+">"+(ok?"✓ ":"")+(i+1)+". "+esc(b[0])+tag+"</button>";}).join("")+
     '<button data-go="'+(N+1)+'">→ К отправке</button></div>' : "");
}

function buildText(){
  // Без ответа не пишем целиком, только номера в конце: так сообщение короче
  let s = "Ответы на анкету (" + NAME + ")\n", last = "", skip = [];
  BLOCKS.forEach(([title,qs])=>{
    const shown = qs.filter(vis).filter(q=>answered(q) || (skip.push(q[0]), false));
    if(!shown.length) return;
    if(title !== last) s += "\n== " + title + " ==\n";
    last = title;
    shown.forEach(q=>{
      const x = S.a[q[0]];
      s += "\n" + q[0] + ". " + q[2] + "\n";
      if(x.v.length) s += "— " + x.v.join("; ") + "\n";
      if(x.n.trim()) s += (q[1]==="text" ? "— " : "  Пояснение: ") + x.n.trim() + "\n";
    });
  });
  if(skip.length) s += "\nБез ответа: " + skip.join(", ") + "\n";
  return s;
}

function finish(){
  const allQ = BLOCKS.flatMap(b=>b[1]).filter(vis), miss = allQ.filter(q=>!answered(q));
  let h = "<h1>" + (miss.length ? "Почти готово" : "Спасибо, это все вопросы!") + "</h1>";
  h += '<div class="card actions"><div class="q">Отправить ответы</div><div class="hint">Откроется WhatsApp с готовым сообщением мне, останется нажать «Отправить».</div>'+
    '<button class="main" id="wa">Отправить в WhatsApp</button>'+
    '<button id="share">Отправить другим способом</button>'+
    '<button id="copy">Скопировать текст</button><div class="saved" id="msg"></div></div>';
  if(miss.length) h +='<div class="card"><div class="q">Без ответа: '+miss.length+'</div><div class="hint">Можно вернуться и ответить, а можно отправить как есть.</div>'+
    '<div class="list">'+miss.slice(0,12).map(q=>{const bi=BLOCKS.findIndex(b=>b[1].includes(q));return '<button data-go="'+(bi+1)+'">'+q[0]+". "+esc(q[2])+"</button>";}).join("")+(miss.length>12?'<div class="small" style="margin-top:8px">…и ещё '+(miss.length-12)+"</div>":"")+"</div></div>";
  h += '<div class="card"><div class="q">Как это выглядит</div><textarea readonly style="min-height:220px;font-size:14px">'+esc(buildText())+"</textarea></div>";
  app.innerHTML = h;
  window.scrollTo(0,0);
  const msg = t=>document.getElementById("msg").textContent=t;
  document.getElementById("share").onclick = async()=>{
    const text = buildText();
    if(navigator.share){ try{ await navigator.share({text}); return; }catch(e){ if(e.name==="AbortError") return; } }
    copy(text, msg);
  };
  // Длинный текст в ссылке WhatsApp может обрезаться, поэтому шлём частями по блокам
  const parts = chunks(buildText(), 2500), wa = document.getElementById("wa");
  if(parts.length > 1) wa.insertAdjacentHTML("beforebegin", '<div class="hint">Ответов много, поэтому они уйдут в '+parts.length+' сообщениях. Нажимайте кнопки по очереди.</div>');
  let prev = wa;
  parts.forEach((p,i)=>{
    let b = wa;
    if(i){ b = document.createElement("button"); b.className = "main"; prev.after(b); }
    if(parts.length > 1) b.textContent = "Отправить в WhatsApp: часть " + (i+1) + " из " + parts.length;
    b.onclick = ()=>{ b.style.opacity = ".55"; flush(); location.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(p); };
    prev = b;
  });
  document.getElementById("copy").onclick = ()=>copy(buildText(), msg);
}

function chunks(text, max){
  const secs = text.split(/\n(?=== )/), out = [];
  let cur = "";
  secs.forEach(s=>{ if(cur && (cur.length + s.length + 1) > max){ out.push(cur); cur = s; } else cur = cur ? cur + "\n" + s : s; });
  if(cur) out.push(cur);
  return out.length > 1 ? out.map((p,i)=>"(" + (i+1) + "/" + out.length + ") " + p) : out;
}

function copy(text, msg){
  const done = ()=>msg("Текст скопирован. Вставьте его в чат со мной.");
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, ()=>fallback());
  else fallback();
  function fallback(){ const t=document.createElement("textarea"); t.value=text; document.body.appendChild(t); t.select();
    try{ document.execCommand("copy"); done(); }catch(e){ msg("Не получилось скопировать: выделите текст ниже вручную."); } t.remove(); }
}

app.addEventListener("change", e=>{
  const inp = e.target; if(!inp.dataset.i) return;
  const card = inp.closest(".card"), id = +card.dataset.id;
  const q = BLOCKS.flatMap(b=>b[1]).find(q=>q[0]===id), [, t, , opts, o={}] = q, x = get(id), op = opts[+inp.dataset.i];
  if(t==="one") x.v = [op];
  else if(inp.checked){
    if(EX.includes(op)) x.v = [op];
    else { x.v = x.v.filter(v=>!EX.includes(v));
      if(o.max && x.v.length>=o.max){ inp.checked=false; const hn=card.querySelector(".hint"); hn.textContent="Не больше "+o.max+": сначала снимите одну галочку"; hn.style.color="var(--warn)"; return; }
      x.v.push(op); }
  } else x.v = x.v.filter(v=>v!==op);
  save();
  const sy = window.scrollY; render(); window.scrollTo(0,sy);
});
app.addEventListener("input", e=>{
  const n = e.target.dataset.n; if(!n) return;
  get(+n).n = e.target.value; save();
  const s = document.getElementById("saved"); if(s) s.textContent = "Сохранено";
  sendCard();
});
app.addEventListener("click", e=>{
  const g = e.target.closest("[data-go]"); if(!g) return;
  S.step = +g.dataset.go; save(); render();
});
document.getElementById("next").onclick = ()=>{ S.step = Math.min(S.step+1, N+1); save(); render(); };
document.getElementById("back").onclick = ()=>{ S.step = Math.max(S.step-1, 0); save(); render(); };
render();
loadCloud();
</script>
</body>
</html>
